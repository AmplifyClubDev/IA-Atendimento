name: Testes do Cadastro

on:
  push:
    paths: ["cadastro/**", ".github/workflows/cadastro-testes.yml"]
  pull_request:
    paths: ["cadastro/**", ".github/workflows/cadastro-testes.yml"]

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cadastro
    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL 17 (repositório oficial)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
          echo "CADASTRO_TEST_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5

      - name: Testes
        run: >
          uv run --python 3.12 --with pytest --with "psycopg[binary]"
          --with-requirements app/requirements.txt python -m pytest -q tests
